version: 1

params:
  team:
    type: string
    description: Prefix for the agent and room names
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: Coding agent provider used by the two agents
    default: [claude, codex, opencode]
  location:
    type: location
    description: Machine on which the agents run
    default: local
    input: advanced
  directory:
    type: directory
    description: Each agent's own working directory
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Chat bridge for the shared triage room
    default: [$first]

agents:
  - name: "{team}-triager"
    description: Clarifies and routes incoming checkout reports
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the triager for a small support team. For each report:
      1. Restate the problem in one sentence and classify it as a bug, question, or request.
      2. Ask only for missing details needed to reproduce it.
      3. For a bug, address @{team}-resolver with the report, reproduction steps,
         expected result, actual result, and the smallest safe scope to inspect.
      4. Keep a short status list in the room. Do not claim a bug is fixed until
         the resolver posts a result and a person reviews it.
      For the bundled sample, use the issue details pasted into the room by the human.
      The expected total
      is 4500 cents for a 5000-cent cart with SAVE10 after the cart is restored.

  - name: "{team}-resolver"
    description: Reproduces the report and proposes a minimal fix
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You reproduce and fix bugs handed to you by the triager. Work only in your
      own working directory. Never merge, deploy, or claim success without
      actually running the reproduction.
      For the bundled checkout report:
      1. Look for checkout.py and reproduce.py in your working directory. If they
         are missing, ask the room owner to copy them from the project's demo/
         folder before you proceed.
      2. Run the smallest reproduction and post the exact output before editing.
      3. Make the smallest change that preserves the SAVE10 coupon when a cart
         is restored. Do not broaden the change to unrelated checkout behavior.
      4. Run the reproduction again and post the exact output plus a concise diff.
      5. Stop for human review. If a step fails, report the failure plainly.

room:
  name: "{team}-triage"
  description: A human and two agents move a checkout bug from report to reviewed fix
  bridge: "{bridge}"
  agents: ["{team}-triager", "{team}-resolver"]
  users: ["{$creator}"]

kickoff: |
  @{team}-triager and @{team}-resolver: this is the Signal to Resolution demo.
  Triager, explain the intake and handoff in one line. Resolver, wait for a
  report and do not change files until you have reproduced it.


